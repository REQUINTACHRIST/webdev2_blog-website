/name: Publish approved recipe

on:
  issues:
    types: [labeled]

permissions:
  contents: read

concurrency:
  group: publish-approved-recipes
  cancel-in-progress: false

jobs:
  publish:
    if: github.event.label.name == 'recipe-approved' && startsWith(github.event.issue.title, 'Recipe submission:')
    runs-on: ubuntu-latest
    outputs:
      published: ${{ steps.publish.outputs.published }}
    permissions:
      contents: write
      issues: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/github-script@v7
        id: publish
        with:
          script: |
            const fs = require('node:fs');
            const path = 'data/recipes.json';
            const { recipeFromIssue } = require('./scripts/recipe-issue');
            const issue = context.payload.issue;
            let recipe;
            try {
              recipe = recipeFromIssue(issue);
              const recipes = JSON.parse(fs.readFileSync(path, 'utf8'));
              if (!Array.isArray(recipes)) throw new Error('The recipe catalog must be a JSON array.');
              if (recipes.some(item => item.issueNumber === issue.number)) {
                core.setOutput('published', 'false');
                return;
              }
              if (recipes.some(item => item.id === recipe.id)) {
                recipe.id += '-' + issue.number;
              }
              recipes.push(recipe);
              recipes.sort((a, b) => String(b.publishedAt).localeCompare(String(a.publishedAt)));
              fs.writeFileSync(path, JSON.stringify(recipes, null, 2) + '\n');
              core.setOutput('published', 'true');
            } catch (error) {
              await github.rest.issues.createComment({
                ...context.repo,
                issue_number: issue.number,
                body: `Publishing failed: ${error.message}`
              });
              core.setFailed(error.message);
            }
      - name: Commit approved recipe
        if: steps.publish.outputs.published == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/recipes.json
          git commit -m "Publish community recipe from issue #${{ github.event.issue.number }}"
          git push
      - uses: actions/github-script@v7
        if: steps.publish.outputs.published == 'true'
        with:
          script: |
            await github.rest.issues.createComment({
              ...context.repo,
              issue_number: context.payload.issue.number,
              body: 'Recipe successfully published! The website will update shortly. This issue is also the recipe discussion, so readers can comment and reply here.'
            });
            await github.rest.issues.removeLabel({
              ...context.repo,
              issue_number: context.payload.issue.number,
              name: 'recipe-approved'
            });

  deploy:
    needs: publish
    if: always() && needs.publish.outputs.published == 'true'
    runs-on: ubuntu-latest
    concurrency:
      group: github-pages
      cancel-in-progress: false
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.repository.default_branch }}
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
